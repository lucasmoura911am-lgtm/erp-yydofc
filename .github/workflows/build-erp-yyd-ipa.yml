name: Build ERP YYD unsigned IPA

on:
  issues:
    types: [opened]

jobs:
  build:
    if: contains(github.event.issue.title, '[BUILD IPA]')
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Capacitor iOS wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrapper/native-shell
          cd wrapper
          npm init -y >/dev/null
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'br.com.yydifm.erp',
            appName: 'ERP YYD',
            webDir: 'native-shell',
            server: {
              url: 'https://erp.yydifm.com.br/AppHome?source=native',
              cleartext: false,
              allowNavigation: ['erp.yydifm.com.br', '*.base44.com']
            }
          };
          export default config;
          EOF

          cat > native-shell/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <title>ERP YYD</title>
            </head>
            <body>
              <h1>ERP YYD</h1>
            </body>
          </html>
          EOF

          npx cap add ios
          npx cap sync ios

      - name: Configure permissions
        shell: bash
        run: |
          set -euo pipefail
          P="wrapper/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ERP YYD" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string O ERP YYD usa a câmera para registro de ponto e anexos autorizados." "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string O ERP YYD usa sua localização durante o registro de ponto." "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string O ERP YYD acessa a biblioteca de fotos quando você escolhe anexar uma imagem." "$P" || true

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          cd wrapper
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Release             -sdk iphoneos             -derivedDataPath build             PRODUCT_BUNDLE_IDENTIFIER=br.com.yydifm.erp             MARKETING_VERSION=1.0             CURRENT_PROJECT_VERSION=1             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="wrapper/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/ERPYYD.app
          zip -qry ERP-YYD-iOS-unsigned.ipa Payload
          shasum -a 256 ERP-YYD-iOS-unsigned.ipa > ERP-YYD-iOS-unsigned.sha256
          ls -lh ERP-YYD-iOS-unsigned.ipa
          cat ERP-YYD-iOS-unsigned.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ERP-YYD-iOS-unsigned
          path: |
            ERP-YYD-iOS-unsigned.ipa
            ERP-YYD-iOS-unsigned.sha256
          retention-days: 7
